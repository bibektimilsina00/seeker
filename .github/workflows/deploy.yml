name: Fast CI/CD & Deploy to VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push GHCR Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker image (ARM64 Optimized)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS (riossh)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy container via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "==> Deploying Seeker to VPS..."
            cd /opt/seeker
            curl -sSL https://raw.githubusercontent.com/bibektimilsina00/seeker/master/docker-compose.yml -o docker-compose.yml || true
            if [ -f db/config.json ]; then
              sed -i 's/"template_id": [0-9]*/"template_id": 2/g' db/config.json || true
              sed -i 's/"template_name": "[^"]*"/"template_name": "WhatsApp"/g' db/config.json || true
            fi
            docker compose pull
            docker compose down || true
            docker compose up -d --remove-orphans
            echo "==> Verifying running container..."
            sleep 2
            docker ps --filter "name=seeker_tracker" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "==> Deployment Complete!"
